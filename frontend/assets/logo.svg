<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="dc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8B6E" />
      <stop offset="100%" stop-color="#1F634E" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#2D8B6E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2421" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Base document sheet -->
    <rect x="2" y="2" width="34" height="44" rx="7" fill="url(#dc-grad)" />
    <!-- Folded corner / notch -->
    <path d="M26 2 L36 12 L26 12 Z" fill="#4ADE80" opacity="0.8" />
    <!-- Security shield / blockchain node -->
    <circle cx="19" cy="24" r="10" fill="#FFFFFF" fill-opacity="0.15" />
    <path d="M19 18 L25 21 V26 C25 29.5 22.5 32 19 33 C15.5 32 13 29.5 13 26 V21 Z" fill="#FFFFFF" />
    <path d="M16.5 25.5 L18.5 27.5 L22 23" stroke="#2D8B6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chain nodes -->
    <circle cx="9" cy="38" r="2.5" fill="#4ADE80" />
    <circle cx="19" cy="38" r="2.5" fill="#4ADE80" />
    <circle cx="29" cy="38" r="2.5" fill="#4ADE80" />
    <line x1="11.5" y1="38" x2="16.5" y2="38" stroke="#4ADE80" stroke-width="1.5" stroke-linecap="round" />
    <line x1="21.5" y1="38" x2="26.5" y2="38" stroke="#4ADE80" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <text x="56" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#1B2421" letter-spacing="-0.5px">Docu<tspan fill="#2D8B6E">Chain</tspan></text>
  <text x="56" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6B7A72" letter-spacing="1.2px">DECENTRALIZED VERIFICATION</text>
</svg>
